<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only our own files run here; tiles, glyphs and sprites come from the https map provider. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; font-src 'self' data:">
  <link rel="stylesheet" href="maplibre-gl.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <div id="map"></div>
  <script type="module" src="map.js"></script>
</body>
</html>
