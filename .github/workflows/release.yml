name: Release

# Push a tag like v0.1.0-beta.2 to publish a version. Installed copies find it on their next check and update
# themselves (Velopack, from this repository's GitHub Releases).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag must look like v1.2.3 or v1.2.3-beta.1" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release

      - name: Publish window (self-contained) and tracker (NativeAOT)
        shell: pwsh
        run: |
          dotnet publish src/AimOdometer.App -c Release -o publish -p:Version=$env:VERSION
          dotnet publish src/AimOdometer.Tracker -c Release -o publish -p:Version=$env:VERSION
          Get-ChildItem publish -Filter *.pdb | Remove-Item

      # ---- Code signing (SignPath Foundation; docs/CODE_SIGNING.md). Off until the repository variable
      # SIGNPATH_ORGANIZATION_ID is set; every request waits for a manual approval in SignPath.
      - name: Collect AimOdometer's own binaries for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory unsigned | Out-Null
          Get-ChildItem publish -File | Where-Object { $_.Name -like 'AimOdometer.*' -and $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination unsigned

      - name: Upload binaries to sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned-binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: unsigned/

      - name: Sign binaries (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Put the signed binaries back
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item signed/* publish -Force

      - name: Install vpk
        run: dotnet tool restore

      - name: Previous release (for delta updates)
        shell: pwsh
        run: dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --pre -o releases
        continue-on-error: true

      - name: Pack (Setup.exe, portable zip, update packages)
        shell: pwsh
        run: |
          "AimOdometer $env:VERSION. What changed: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md" | Set-Content notes.md
          dotnet vpk pack --packId AimOdometerApp --packVersion $env:VERSION --packDir publish --mainExe AimOdometer.App.exe `
            --packTitle AimOdometer --packAuthors zegolka-dev --icon assets/icon.ico --releaseNotes notes.md -o releases

      - name: Upload the installer to sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: releases/AimOdometerApp-win-Setup.exe

      - name: Sign the installer (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Put the signed installer back
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item signed-setup/AimOdometerApp-win-Setup.exe releases -Force

      - name: Upload to GitHub Releases
        shell: pwsh
        run: |
          $arguments = @("vpk", "upload", "github", "--repoUrl", "https://github.com/${{ github.repository }}",
            "--token", "${{ secrets.GITHUB_TOKEN }}", "--publish", "--releaseName", "AimOdometer $env:VERSION",
            "--tag", "${{ github.ref_name }}", "-o", "releases")
          if ($env:PRERELEASE -eq 'true') { $arguments += "--pre" }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw "Upload failed" }
